<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900 text-slate-100">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MASTER EVENTOS - Gestión de Inventario y Equipos</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']},colors:{master:{purple:'#7c3aed',show:'#ec4899',drinkmy:'#3b82f6',sportiz:'#10b981',gold:'#f59e0b'}}}}}
</script>
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#1e293b}
::-webkit-scrollbar-thumb{background:#475569;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#64748b}
.gradient-brand{background:linear-gradient(135deg,#7c3aed 0%,#ec4899 50%,#3b82f6 100%)}
.glass-card{background:rgba(30,41,59,.7);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08)}
</style>
</head>
<body class="h-full flex flex-col font-sans antialiased bg-slate-950 text-slate-100 selection:bg-purple-500 selection:text-white">

<!-- MODAL DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
<div id="auth-modal" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
  <div class="glass-card max-w-md w-full p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
    <div class="text-center">
      <div class="w-12 h-12 rounded-2xl gradient-brand mx-auto flex items-center justify-center text-white font-extrabold text-2xl shadow-lg shadow-purple-500/30 mb-3">M</div>
      <h2 id="auth-title" class="text-xl font-extrabold text-white">Iniciar Sesión</h2>
      <p id="auth-subtitle" class="text-xs text-slate-400 mt-1">Ingresa tus datos para acceder al sistema privado</p>
    </div>

    <!-- Formulario de Iniciar Sesión -->
    <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Correo Electrónico</label>
        <input type="email" id="login-email" required placeholder="usuario@mastereventos.com" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Contraseña</label>
        <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
      </div>
      <button type="submit" class="w-full py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-purple-900/40 transition-all">Ingresar</button>
      <p class="text-center text-xs text-slate-400">¿No tienes cuenta? <button type="button" onclick="toggleAuthMode('register')" class="text-purple-400 font-bold hover:underline">Registrarse</button></p>
    </form>

    <!-- Formulario de Registro -->
    <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Nombre Completo</label>
        <input type="text" id="reg-name" required placeholder="Ej. Juan Pérez" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Correo Electrónico</label>
        <input type="email" id="reg-email" required placeholder="usuario@mastereventos.com" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Contraseña</label>
        <input type="password" id="reg-password" required minlength="6" placeholder="Mínimo 6 caracteres" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Cargo / Responsabilidad</label>
        <select id="reg-role" required class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
          <option value="JEFE MASTER EVENTOS">JEFE MASTER EVENTOS</option>
          <option value="JEFE MASTER SHOW">JEFE MASTER SHOW</option>
          <option value="ENCARGADA DE INVENTARIO">ENCARGADA DE INVENTARIO</option>
        </select>
      </div>
      <button type="submit" class="w-full py-3 bg-pink-600 hover:bg-pink-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-pink-900/40 transition-all">Crear Cuenta</button>
      <p class="text-center text-xs text-slate-400">¿Ya tienes usuario? <button type="button" onclick="toggleAuthMode('login')" class="text-pink-400 font-bold hover:underline">Iniciar Sesión</button></p>
    </form>
  </div>
</div>

<!-- CONTENIDO PRINCIPAL DE LA APLICACIÓN -->
<div id="app-content" class="hidden flex-1 flex flex-col h-full">
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-3 transition-all">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('dashboard')">
          <div class="w-10 h-10 rounded-xl gradient-brand flex items-center justify-center text-white font-extrabold text-xl shadow-lg shadow-purple-500/20">M</div>
          <div>
            <h1 class="font-extrabold text-lg tracking-tight text-white flex items-center gap-2">MASTER EVENTOS <span class="text-xs px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-300 font-medium border border-purple-500/30">PRO</span></h1>
            <p id="user-display" class="text-xs text-slate-400">Cargando usuario...</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="logout()" class="px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded-xl text-xs font-bold transition-all"><i class="fa-solid fa-right-from-bracket mr-1"></i> Salir</button>
          <button onclick="toggleMobileNav()" class="md:hidden p-2 text-slate-400 hover:text-white rounded-lg bg-slate-800"><i class="fa-solid fa-bars text-xl"></i></button>
        </div>
      </div>
      <div id="brand-filters" class="flex items-center gap-1.5 overflow-x-auto pb-1 md:pb-0"></div>
      <div class="hidden md:flex items-center gap-2">
        <button onclick="openEvent()" class="px-3.5 py-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white rounded-xl text-xs font-bold shadow-md shadow-purple-900/30 flex items-center gap-1.5 transition-all"><i class="fa-solid fa-plus"></i> Nuevo Evento</button>
        <button onclick="openItem()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all"><i class="fa-solid fa-box-archive"></i> Nuevo Artículo</button>
      </div>
    </div>
  </header>

  <div class="flex-1 flex overflow-hidden max-w-7xl w-full mx-auto">
    <aside class="hidden md:flex flex-col w-64 bg-slate-900/50 border-r border-slate-800 p-4 gap-1 select-none">
      <div class="px-3 py-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">Menú Principal</div>
      <div id="side-nav" class="flex flex-col gap-1"></div>
    </aside>

    <main class="flex-1 overflow-y-auto p-4 lg:p-6 pb-24 md:pb-6">
      <section id="tab-dashboard" class="tab-content space-y-6"></section>
      <section id="tab-inventory" class="tab-content hidden space-y-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 glass-card p-4 rounded-2xl">
          <div class="flex-1 relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="inventory-search" oninput="renderInventory()" placeholder="Buscar ítem por nombre, notas, talla..." class="w-full pl-10 pr-4 py-2 bg-slate-800/90 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-purple-500">
          </div>
          <button onclick="openPanelModal()" class="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold whitespace-nowrap shadow-md flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Nuevo Panel</button>
        </div>
        <div id="panels-list" class="space-y-4"></div>
      </section>
      <section id="tab-events" class="tab-content hidden space-y-6"><div id="events-list-container" class="space-y-4"></div></section>
      <section id="tab-workers" class="tab-content hidden space-y-6"><div id="workers-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div></section>
    </main>
  </div>
</div>

<div id="modals"></div>

<!-- SDKs de Firebase y Lógica del Sistema -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBgCTiU-NGy6rNMofNw5b_1rCyuXFxdqEc",
    authDomain: "inventario-master-eventos.firebaseapp.com",
    projectId: "inventario-master-eventos",
    storageBucket: "inventario-master-eventos.firebasestorage.app",
    messagingSenderId: "366733726373",
    appId: "1:366733726373:web:5c11a73d2568936780734c",
    measurementId: "G-L8107NBY2X"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUserData = null;

  // Estado Global de la App
  window.BRANDS = [
    { id: 'all', name: 'Todas', color: 'bg-slate-700' },
    { id: 'master', name: 'Master Eventos', color: 'bg-purple-600' },
    { id: 'show', name: 'Master Show', color: 'bg-pink-600' },
    { id: 'drinkmy', name: 'DrinkMy', color: 'bg-blue-600' },
    { id: 'sportiz', name: 'Sportiz', color: 'bg-emerald-600' }
  ];

  window.activeBrand = 'all';
  window.activeTab = 'dashboard';

  window.panels = [];
  window.items = [];
  window.workers = [];
  window.events = [];

  // Sincronización en tiempo real con Firestore
  function initFirestoreSync() {
    onSnapshot(doc(db, "appData", "master_store"), (docSnap) => {
      if (docSnap.exists()) {
        const data = docSnap.data();
        window.panels = data.panels || [];
        window.items = data.items || [];
        window.workers = data.workers || [];
        window.events = data.events || [];
      } else {
        // Datos por defecto si la BD está vacía
        window.panels = [{ id: 'p1', name: 'Electrónica y Sonido', brand: 'master' }];
        window.items = [];
        window.workers = [];
        window.events = [];
        saveData();
      }
      renderCurrentTab();
    }, (error) => {
      console.error("Error sincronizando Firebase:", error);
    });
  }

  // Guardar datos en la nube
  window.saveData = async () => {
    try {
      await setDoc(doc(db, "appData", "master_store"), {
        panels: window.panels,
        items: window.items,
        workers: window.workers,
        events: window.events
      });
    } catch (err) {
      console.error("Error al guardar en Firestore:", err);
    }
  };

  // Autenticación
  window.toggleAuthMode = (mode) => {
    if (mode === 'register') {
      document.getElementById('form-login').classList.add('hidden');
      document.getElementById('form-register').classList.remove('hidden');
      document.getElementById('auth-title').textContent = 'Crear Usuario';
      document.getElementById('auth-subtitle').textContent = 'Registra tus datos y asigna tu cargo';
    } else {
      document.getElementById('form-register').classList.add('hidden');
      document.getElementById('form-login').classList.remove('hidden');
      document.getElementById('auth-title').textContent = 'Iniciar Sesión';
      document.getElementById('auth-subtitle').textContent = 'Ingresa tus datos para acceder al sistema privado';
    }
  };

  window.handleRegister = async (e) => {
    e.preventDefault();
    const name = document.getElementById('reg-name').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    const role = document.getElementById('reg-role').value;

    try {
      const res = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "users", res.user.uid), {
        name,
        email,
        role,
        createdAt: new Date()
      });
      alert("Usuario registrado con éxito.");
    } catch (err) {
      alert("Error al registrar usuario: " + err.message);
    }
  };

  window.handleLogin = async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      alert("Error al iniciar sesión: Verifique el correo o contraseña.");
    }
  };

  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      currentUserData = userDoc.exists() ? userDoc.data() : { name: user.email, role: 'USUARIO' };

      document.getElementById('auth-modal').classList.add('hidden');
      document.getElementById('app-content').classList.remove('hidden');
      document.getElementById('user-display').innerHTML = `<b class="text-purple-300">${currentUserData.name}</b> (${currentUserData.role})`;

      initFirestoreSync();
      renderNavigation();
      renderBrandFilters();
    } else {
      document.getElementById('auth-modal').classList.remove('hidden');
      document.getElementById('app-content').classList.add('hidden');
    }
  });

  // Lógica UI & Renders
  window.switchTab = (tab) => {
    window.activeTab = tab;
    document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
    const target = document.getElementById(`tab-${tab}`);
    if (target) target.classList.remove('hidden');
    renderNavigation();
    renderCurrentTab();
  };

  window.setBrandFilter = (brandId) => {
    window.activeBrand = brandId;
    renderBrandFilters();
    renderCurrentTab();
  };

  window.renderNavigation = () => {
    const navItems = [
      { id: 'dashboard', label: 'Panel General', icon: 'fa-chart-pie' },
      { id: 'inventory', label: 'Inventario', icon: 'fa-boxes-stacked' },
      { id: 'events', label: 'Eventos', icon: 'fa-calendar-days' },
      { id: 'workers', label: 'Personal / Asignaciones', icon: 'fa-users' }
    ];

    const container = document.getElementById('side-nav');
    if (!container) return;
    container.innerHTML = navItems.map(item => `
      <button onclick="switchTab('${item.id}')" class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${window.activeTab === item.id ? 'bg-purple-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'}">
        <i class="fa-solid ${item.icon} text-sm"></i>
        <span>${item.label}</span>
      </button>
    `).join('');
  };

  window.renderBrandFilters = () => {
    const container = document.getElementById('brand-filters');
    if (!container) return;
    container.innerHTML = window.BRANDS.map(b => `
      <button onclick="setBrandFilter('${b.id}')" class="px-3 py-1 rounded-lg text-xs font-bold transition-all whitespace-nowrap ${window.activeBrand === b.id ? `${b.color} text-white shadow-md` : 'bg-slate-800 text-slate-400 hover:text-white'}">
        ${b.name}
      </button>
    `).join('');
  };

  window.renderCurrentTab = () => {
    if (window.activeTab === 'dashboard') renderDashboard();
    else if (window.activeTab === 'inventory') renderInventory();
    else if (window.activeTab === 'events') renderEvents();
    else if (window.activeTab === 'workers') renderWorkers();
  };

  // Dashboard
  function renderDashboard() {
    const container = document.getElementById('tab-dashboard');
    if (!container) return;

    const filteredItems = window.activeBrand === 'all' ? window.items : window.items.filter(i => i.brand === window.activeBrand);
    const totalQty = filteredItems.reduce((acc, i) => acc + Number(i.qty || 0), 0);
    const activeEvts = window.events.filter(e => e.status !== 'Finalizado').length;

    container.innerHTML = `
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="glass-card p-5 rounded-2xl border-l-4 border-purple-500">
          <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Total Ítems</div>
          <div class="text-3xl font-extrabold text-white mt-2">${filteredItems.length}</div>
          <div class="text-xs text-slate-500 mt-1">${totalQty} unidades totales</div>
        </div>
        <div class="glass-card p-5 rounded-2xl border-l-4 border-pink-500">
          <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Eventos Activos</div>
          <div class="text-3xl font-extrabold text-white mt-2">${activeEvts}</div>
          <div class="text-xs text-slate-500 mt-1">En preparación o curso</div>
        </div>
        <div class="glass-card p-5 rounded-2xl border-l-4 border-blue-500">
          <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Personal Registrado</div>
          <div class="text-3xl font-extrabold text-white mt-2">${window.workers.length}</div>
          <div class="text-xs text-slate-500 mt-1">Colaboradores activos</div>
        </div>
        <div class="glass-card p-5 rounded-2xl border-l-4 border-emerald-500">
          <div class="text-xs text-slate-400 font-bold uppercase tracking-wider">Paneles</div>
          <div class="text-3xl font-extrabold text-white mt-2">${window.panels.length}</div>
          <div class="text-xs text-slate-500 mt-1">Categorías activas</div>
        </div>
      </div>

      <div class="glass-card p-6 rounded-2xl space-y-4">
        <h3 class="text-sm font-bold text-white flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left text-purple-400"></i> Eventos Recientes</h3>
        <div class="divide-y divide-slate-800">
          ${window.events.length === 0 ? '<p class="text-xs text-slate-500 py-4">No hay eventos registrados.</p>' : window.events.slice(-5).map(e => `
            <div class="py-3 flex items-center justify-between">
              <div>
                <p class="text-xs font-bold text-white">${e.name}</p>
                <p class="text-[10px] text-slate-400">${e.date \vert{}\vert{} 'Sin fecha'} •${e.location || 'Sin ubicación'}</p>
              </div>
              <span class="px-2 py-1 rounded-md text-[10px] font-bold ${e.status === 'Finalizado' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${e.status || 'Pendiente'}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // Inventario
  window.renderInventory = () => {
    const container = document.getElementById('panels-list');
    if (!container) return;

    const query = (document.getElementById('inventory-search')?.value || '').toLowerCase();
    const filteredPanels = window.activeBrand === 'all' ? window.panels : window.panels.filter(p => p.brand === window.activeBrand);

    if (filteredPanels.length === 0) {
      container.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">No se encontraron paneles.</p>`;
      return;
    }

    container.innerHTML = filteredPanels.map(p => {
      const panelItems = window.items.filter(i => i.panelId === p.id && (i.name.toLowerCase().includes(query) || (i.notes && i.notes.toLowerCase().includes(query))));
      return `
        <div class="glass-card rounded-2xl overflow-hidden border border-slate-800">
          <div class="p-4 bg-slate-800/50 flex items-center justify-between">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">
              <i class="fa-solid fa-folder text-purple-400"></i> ${p.name}
            </h3>
            <div class="flex items-center gap-2">
              <button onclick="openItem('${p.id}')" class="px-2.5 py-1 bg-purple-600/30 hover:bg-purple-600 text-purple-200 hover:text-white border border-purple-500/30 rounded-lg text-xs font-bold transition-all">+ Ítem</button>
              <button onclick="deletePanel('${p.id}')" class="p-1 text-slate-500 hover:text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
          <div class="p-4">
            ${panelItems.length === 0 ? '<p class="text-xs text-slate-500">Sin ítems en este panel.</p>' : `
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="text-slate-400 border-b border-slate-800">
                      <th class="pb-2">Nombre</th>
                      <th class="pb-2">Cantidad</th>
                      <th class="pb-2">Notas / Detalle</th>
                      <th class="pb-2 text-right">Acciones</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/50">
                    ${panelItems.map(item => `
                      <tr>
                        <td class="py-2.5 font-semibold text-white">${item.name}</td>
                        <td class="py-2.5 text-purple-300 font-bold">${item.qty}</td>
                        <td class="py-2.5 text-slate-400">${item.notes || '-'}</td>
                        <td class="py-2.5 text-right">
                          <button onclick="deleteItem('${item.id}')" class="text-slate-500 hover:text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        </div>
      `;
    }).join('');
  };

  // Modales y Acciones
  window.openPanelModal = () => {
    const name = prompt("Nombre del nuevo panel:");
    if (!name) return;
    window.panels.push({ id: 'p_' + Date.now(), name, brand: window.activeBrand === 'all' ? 'master' : window.activeBrand });
    window.saveData();
  };

  window.deletePanel = (id) => {
    if (!confirm("¿Eliminar panel y sus ítems?")) return;
    window.panels = window.panels.filter(p => p.id !== id);
    window.items = window.items.filter(i => i.panelId !== id);
    window.saveData();
  };

  window.openItem = (panelId = null) => {
    const pId = panelId || (window.panels[0] ? window.panels[0].id : null);
    if (!pId) {
      alert("Crea un panel primero.");
      return;
    }
    const name = prompt("Nombre del artículo:");
    if (!name) return;
    const qty = parseInt(prompt("Cantidad:", "1") || "1", 10);
    const notes = prompt("Notas adicionales (talla, observaciones, etc.):", "");

    window.items.push({
      id: 'i_' + Date.now(),
      panelId: pId,
      name,
      qty,
      notes,
      brand: window.activeBrand === 'all' ? 'master' : window.activeBrand
    });
    window.saveData();
  };

  window.deleteItem = (id) => {
    if (!confirm("¿Eliminar este artículo?")) return;
    window.items = window.items.filter(i => i.id !== id);
    window.saveData();
  };

  // Eventos
  window.renderEvents = () => {
    const container = document.getElementById('events-list-container');
    if (!container) return;

    if (window.events.length === 0) {
      container.innerHTML = `
        <div class="glass-card p-8 rounded-2xl text-center space-y-3">
          <p class="text-xs text-slate-400">No hay eventos creados.</p>
          <button onclick="openEvent()" class="px-4 py-2 bg-purple-600 text-white rounded-xl text-xs font-bold shadow-md">+ Crear Primer Evento</button>
        </div>
      `;
      return;
    }

    container.innerHTML = window.events.map(evt => `
      <div class="glass-card p-5 rounded-2xl space-y-3 border border-slate-800">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="text-sm font-bold text-white">${evt.name}</h3>
            <p class="text-xs text-slate-400"><i class="fa-solid fa-location-dot text-rose-400 mr-1"></i>${evt.location || 'Sin dirección'} | <i class="fa-solid fa-calendar text-purple-400 mr-1"></i>${evt.date || 'Sin fecha'}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${evt.status === 'Finalizado' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${evt.status}</span>
            <button onclick="deleteEvent('${evt.id}')" class="text-slate-500 hover:text-rose-400 text-xs p-1"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      </div>
    `).join('');
  };

  window.openEvent = () => {
    const name = prompt("Nombre del Evento:");
    if (!name) return;
    const location = prompt("Ubicación / Lugar:", "");
    const date = prompt("Fecha del evento (AAAA-MM-DD):", new Date().toISOString().split('T')[0]);

    window.events.push({
      id: 'e_' + Date.now(),
      name,
      location,
      date,
      status: 'Planificado'
    });
    window.saveData();
  };

  window.deleteEvent = (id) => {
    if (!confirm("¿Eliminar este evento?")) return;
    window.events = window.events.filter(e => e.id !== id);
    window.saveData();
  };

  // Personal
  window.renderWorkers = () => {
    const container = document.getElementById('workers-grid');
    if (!container) return;

    if (window.workers.length === 0) {
      container.innerHTML = `
        <div class="col-span-full glass-card p-8 rounded-2xl text-center space-y-3">
          <p class="text-xs text-slate-400">No hay personal registrado.</p>
          <button onclick="openWorker()" class="px-4 py-2 bg-purple-600 text-white rounded-xl text-xs font-bold shadow-md">+ Registrar Personal</button>
        </div>
      `;
      return;
    }

    container.innerHTML = window.workers.map(w => `
      <div class="glass-card p-4 rounded-2xl border border-slate-800 space-y-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-purple-600/30 text-purple-300 font-bold flex items-center justify-center text-xs">${w.name.charAt(0)}</div>
            <div>
              <p class="text-xs font-bold text-white">${w.name}</p>
              <p class="text-[10px] text-slate-400">${w.role || 'Colaborador'}</p>
            </div>
          </div>
          <button onclick="deleteWorker('${w.id}')" class="text-slate-500 hover:text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    `).join('');
  };

  window.openWorker = () => {
    const name = prompt("Nombre del Colaborador:");
    if (!name) return;
    const role = prompt("Cargo / Función:", "Logística / Montaje");

    window.workers.push({
      id: 'w_' + Date.now(),
      name,
      role
    });
    window.saveData();
  };

  window.deleteWorker = (id) => {
    if (!confirm("¿Eliminar este trabajador?")) return;
    window.workers = window.workers.filter(w => w.id !== id);
    window.saveData();
  };
</script>
</body>
</html>
